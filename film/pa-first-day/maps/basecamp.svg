<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d" font-family="Montserrat, 'Segoe UI', sans-serif">
  <title id="t">The basecamp map</title>
  <desc id="d">Top-down map of basecamp, a lot on Elm Street two blocks from set. Crew parking is on the west side. In basecamp: the camera truck, the grip and electric truck, and the generator along the north edge, with a keep-clear zone round the generator; the hair and makeup trailer, wardrobe, and the production trailer in the middle row; the honeywagon and the catering tent in the south row. The sign-in table, where you start, is by the lot exit at the south-east corner. Your route to deliver sides runs from sign-in to the hair and makeup door. The walk to set leaves the lot and heads east along Main Street.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2f2f2f" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3a342f" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffffff"/>
    </marker>
    <marker id="arrowglow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00b4f0"/>
    </marker>
    <clipPath id="mapclip"><rect x="40" y="40" width="920" height="600"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#111111"/>
  <rect x="40" y="40" width="920" height="600" fill="#1a1a1a"/>
  <rect x="40" y="40" width="920" height="600" fill="url(#grid)"/>

  <g clip-path="url(#mapclip)">
    <!-- Main Street along the south edge -->
    <path d="M40 500H960 M40 640H960" stroke="#a79281" stroke-width="2" opacity="0.7"/>
    <path d="M40 570H960" stroke="#6b6158" stroke-width="2" stroke-dasharray="18 14"/>
    <!-- lot boundary and the split between parking and basecamp -->
    <rect x="52" y="52" width="896" height="436" fill="none" stroke="#a79281" stroke-width="2" stroke-dasharray="3 5" opacity="0.8"/>
    <path d="M300 52V488" stroke="#a79281" stroke-width="2" opacity="0.6"/>

    <!-- crew parking stalls -->
    <g stroke="#4d453f" stroke-width="2">
      <path d="M60 110H150 M60 170H150 M60 230H150 M60 290H150 M60 350H150 M60 410H150"/>
      <path d="M200 110H290 M200 170H290 M200 230H290 M200 290H290 M200 350H290 M200 410H290"/>
    </g>
    <text x="175" y="460" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#8a8178">CREW PARKING</text>

    <!-- generator keep-clear zone -->
    <rect x="852" y="62" width="90" height="98" fill="#f06a4f" fill-opacity="0.08" stroke="#f06a4f" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="897" y="180" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#f06a4f">KEEP CLEAR</text>

    <!-- vehicles and trailers -->
    <g fill="#222222" stroke="#a79281" stroke-width="2.5">
      <rect x="330" y="70" width="210" height="62" rx="4"/>
      <rect x="570" y="70" width="250" height="62" rx="4"/>
      <rect x="868" y="80" width="58" height="56" rx="4"/>
      <rect x="330" y="215" width="220" height="74" rx="6"/>
      <rect x="580" y="215" width="160" height="74" rx="6"/>
      <rect x="770" y="215" width="170" height="74" rx="6"/>
      <rect x="330" y="360" width="170" height="64" rx="6"/>
    </g>
    <!-- catering tent with tables -->
    <rect x="540" y="340" width="220" height="110" fill="url(#hatch)" stroke="#a79281" stroke-width="2.5" stroke-dasharray="10 5"/>
    <g fill="none" stroke="#a79281" stroke-width="2">
      <rect x="560" y="400" width="60" height="22"/><rect x="680" y="400" width="60" height="22"/>
    </g>
    <!-- cab ends on the trucks -->
    <g fill="#a79281"><rect x="530" y="80" width="10" height="42"/><rect x="810" y="80" width="10" height="42"/></g>
    <!-- trailer doors -->
    <g stroke="#ffffff" stroke-width="3"><path d="M430 289H460 M650 289H675 M845 289H870"/></g>

    <g font-size="12" font-weight="700" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">
      <text x="430" y="106">CAMERA TRUCK</text>
      <text x="690" y="106">GRIP &amp; ELECTRIC</text>
      <text x="897" y="113" font-size="10">GENNY</text>
      <text x="440" y="250" fill="#6ec1e4">HAIR &amp; MAKEUP</text>
      <text x="440" y="268" font-size="10" font-weight="500" fill="#b8c2cc">Jules is in here</text>
      <text x="660" y="257">WARDROBE</text>
      <text x="855" y="257">PRODUCTION</text>
      <text x="415" y="397">HONEYWAGON</text>
      <text x="650" y="380">CATERING</text>
    </g>

    <!-- sign-in table -->
    <rect x="800" y="420" width="100" height="26" fill="#2c2c2c" stroke="#a79281" stroke-width="2"/>
    <text x="850" y="438" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#a79281">SIGN-IN</text>

    <!-- your route: sides to makeup -->
    <path d="M820 400 V330 H460 V300" fill="none" stroke="#00b4f0" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrowglow)"/>
    <text x="640" y="322" text-anchor="middle" font-size="11" fill="#00b4f0">Sides to makeup</text>

    <!-- walk to set -->
    <path d="M930 440 V530 H950" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="912" y="550" text-anchor="end" font-size="11" fill="#ffffff">To set: 2 blocks east</text>

    <!-- you -->
    <circle cx="820" cy="400" r="15" fill="#111111" stroke="#ffffff" stroke-width="2.5"/>
    <text x="820" y="405" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">YOU</text>

    <!-- street names -->
    <g font-size="13" font-weight="700" letter-spacing="3" fill="#8a8178">
      <text x="420" y="610" text-anchor="middle">MAIN STREET</text>
    </g>
    <text x="60" y="545" font-size="11" fill="#b8c2cc">← Nearest hospital: St. Agnes, 2.1 mi (it's on the call sheet)</text>
  </g>

  <!-- compass -->
  <g transform="translate(925 700)" font-size="12" font-weight="700" fill="#b8c2cc" text-anchor="middle">
    <circle r="20" fill="#111111" stroke="#4d453f" stroke-width="2"/>
    <path d="M0 -14 L6 4 L0 0 L-6 4 Z" fill="#b8c2cc"/>
    <text y="-26">N</text>
  </g>

  <!-- scale bar: 20 px = 1 m -->
  <g transform="translate(40 672)" font-size="11" fill="#b8c2cc">
    <rect x="0" y="0" width="50" height="8" fill="#ffffff"/>
    <rect x="50" y="0" width="50" height="8" fill="#111111" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="100" y="0" width="50" height="8" fill="#ffffff"/>
    <rect x="150" y="0" width="50" height="8" fill="#111111" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="-6">0</text><text x="100" y="-6" text-anchor="middle">5 m</text><text x="200" y="-6" text-anchor="middle">10 m</text>
    <text x="200" y="26" text-anchor="middle">≈ 33 ft</text>
  </g>

  <!-- key -->
  <g transform="translate(300 668)" font-size="12" fill="#b8c2cc">
    <path d="M0 4 H30" stroke="#00b4f0" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><text x="38" y="8">Your route</text>
    <path d="M135 4 H165" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6"/><text x="173" y="8">Walk to set</text>
    <rect x="280" y="-4" width="30" height="16" fill="#f06a4f" fill-opacity="0.08" stroke="#f06a4f" stroke-width="2" stroke-dasharray="6 4"/><text x="318" y="8">Keep clear</text>
    <rect x="410" y="-4" width="30" height="16" rx="3" fill="#222222" stroke="#a79281" stroke-width="2"/><text x="448" y="8">Truck or trailer</text>
    <text x="0" y="40" font-size="11">Doors marked in white. Not to scale for people.</text>
  </g>
</svg>
